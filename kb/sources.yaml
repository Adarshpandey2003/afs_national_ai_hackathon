# Knowledge-base sources. Files live in kb/raw/.
# To add a document, prefer `python kb/ingest.py <file> --title ...` or POST /kb/documents: both append an entry
# here and update the search index incrementally. Editing this file by hand requires a full rebuild
# (python kb/build_kb.py && python kb/build_index.py).
#
# evidence_level: vendor_overview | vendor_slides | research_in_vitro_poc | research_lab_note | expert_notes | business_context
# ocr: none | figures (transcribe figure-rich pages) | slides (transcribe every page; for image-only documents)
# scope_note: what the source can and cannot support; shown to the agents with every page.

